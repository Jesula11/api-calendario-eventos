spring.application.name=apicrm

# Configuración del servidor web embebido Tomcat 11
server.port=8080

# Conexión JDBC a PostgreSQL (Base de datos: altair, Esquema predeterminado: crm)
spring.datasource.url=jdbc:mysql://localhost:3306/altair
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (Jakarta Persistence)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true